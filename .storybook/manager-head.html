<!--
  Selected sidebar item, in the Solutions identity: blue #1FBFFF background
  with #031A24 ink on top, in both modes.

  Storybook paints this item with fixed white text (theme.color.lightest) and,
  in dark mode, darkens the background. White on #1FBFFF is below AA contrast,
  and the theme does not expose another color for the text. Hence this rule.

  RISK: `data-nodetype` and `data-selected` are internal Storybook attributes,
  not public API. The `!important` is needed because the CSS generated by
  Storybook has a more specific selector and is injected later. When upgrading
  Storybook, check the selected item and the skip-to-content links in both
  modes.
-->
<style>
  [data-nodetype][data-selected='true'],
  [data-nodetype][data-selected='true']:hover,
  [data-nodetype][data-selected='true']:focus {
    background: #1fbfff !important;
    color: #031a24 !important;
  }

  [data-nodetype][data-selected='true'] svg {
    color: #031a24 !important;
  }

  /*
   * Skip-to-content links, which appear on keyboard focus. Storybook paints
   * text in the secondary color on white; in dark mode, blue on white is below
   * AA. Same pair as the selected item.
   */
  a[href='#storybook-preview-wrapper']:focus,
  a[href='#main-content-wrapper']:focus {
    background: #1fbfff !important;
    color: #031a24 !important;
  }
</style>
