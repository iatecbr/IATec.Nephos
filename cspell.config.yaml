# Spell check of the English text of the repository, in American English
# (P64, amendment of 15/10/2026). Run with: npm run test:spelling
version: '0.2'
language: en-US
useGitignore: true

# What P64 puts in English: the code text of scripts/, src/, stories/ and .storybook/, the specs
# and the documentation (the groups of scripts/language-lib.mjs). Only text files are read; a
# credential file never is.
files:
  - 'src/**/*.{ts,js,css,json}'
  - 'stories/**/*.{ts,js}'
  - '.storybook/**/*.{js,json,html}'
  - 'scripts/**/*.{mjs,json}'
  - 'fichas/**/*.md'
  - 'docs/**/*.md'
  - '{README,AGENTS,CLAUDE,GOVERNANCA,contributing,design}.md'

ignorePaths:
  - '.npmrc*'
  # The pt-BR and es translations stay out (P64, amendment of 15/10/2026).
  - '**/*.pt-BR.md'
  - '**/*.es.md'
  - .storybook/i18n/pt-BR.json
  - .storybook/i18n/es.json
  # The historical record keeps the text of its time (P64, amendment of 15/10/2026).
  - docs/operacao/evidencias/**
  - docs/operacao/contextos/**
  # Done tasks that cite the British text of their time: DSA-30 D8 is the evidence of it, and
  # DSA-15 records the language migration as it was written.
  - docs/operacao/tarefas/DSA-15.md
  - docs/operacao/tarefas/DSA-30.md
  # Generated: the source (the token JSON, the sheet) is what is checked.
  - src/tokens/generated/**
  - src/shared/metadata/**
  # The token source changes only through Claude in Figma (CLAUDE.md, rule 1); its keys, modes
  # and brands are contract, and its descriptions are the Figma reading of their date.
  - src/tokens/source/**
  # Portuguese by design: test fixtures, the Portuguese vocabulary and the exceptions of the
  # language proof (npm run test:naming).
  - scripts/fixtures/**
  - scripts/naming-vocabulary.json
  - scripts/naming-exceptions.json
  - scripts/language-exceptions.json

# The British spellings, flagged with their American form: the en-US dictionary alone accepts some
# of them (centre, catalogue, artefact, grey). labelled and cancelled pass: en-US accepts them.
flagWords:
  - artefact->artifact
  - artefacts->artifacts
  - behaviour->behavior
  - behaviours->behaviors
  - behavioural->behavioral
  - catalogue->catalog
  - catalogues->catalogs
  - centre->center
  - centres->centers
  - centred->centered
  - centring->centering
  - colour->color
  - colours->colors
  - coloured->colored
  - colouring->coloring
  - customisation->customization
  - customise->customize
  - customised->customized
  - grey->gray
  - greyed->grayed
  - greys->grays
  - honour->honor
  - honoured->honored
  - honouring->honoring
  - judgement->judgment
  - licence->license
  - normalise->normalize
  - normalised->normalized
  - normalises->normalizes
  - serialise->serialize
  - serialises->serializes
  - synchronise->synchronize
  - synchronised->synchronized

ignoreRegExpList:
  - Urls
  - Email
  - SHA
  # A path or a token name with a slash (docs/operacao/tarefas/, color/foreground) is a name.
  - '/[\p{L}\w.-]*\/[\p{L}\w./*-]+/gu'
  - '/data:[\w/+.-]+;base64,[\w+/=]+/g'
  # A file or dotted name (verificar-operacao.mjs, com.iatec.nephos) and a command-line flag
  # (--gerar-metadata) are names, as in scripts/language-lib.mjs.
  - '/[\p{L}\p{N}_-]+(?:\.[\p{L}\p{N}_-]+)+/gu'
  - '/(?<![\p{L}\p{N}_-])--[a-z][\w-]*/giu'
  # Public names and ARIA attributes: nph-togglebutton, data-nph-brand, aria-labelledby.
  - '/\b(?:data-)?nph-[\w-]+/g'
  - '/\baria-[a-z]+/g'
  # A snake_case name is a key of the design.md contract (icone_regras, movimento_reduzido).
  - '/[\p{L}\p{N}]+(?:_[\p{L}\p{N}]+)+/gu'
  # In a code comment, a span between backticks is code or a quotation. A template literal in
  # code is text and stays in.
  - '/(?<=^\s*(?:\*|\/\/|\/\*).*)`[^`\n]*`/gm'

languageSettings:
  - languageId: markdown
    # A span between backticks and a fenced block are code or a quotation (P64: a cited term goes
    # between backticks). A json or yaml block is the data of a task or a spec and stays in.
    ignoreRegExpList:
      - '/^\s*(`{3,}|~{3,})(?!\s*(?:json|ya?ml)\b)[\s\S]*?^\s*\1\s*$/gm'
      - '/`[^`\n]*`/g'

overrides:
  # design.md is a YAML contract and GOVERNANCA.md opens with YAML: the keys and the values without
  # a space, a flow-list item included, are contract and stay in Portuguese (DSA-15); the text is
  # the values with a space.
  - filename: '{design,GOVERNANCA}.md'
    ignoreRegExpList:
      - '/^\s*-?\s*[''"]?[\p{L}\w-]+[''"]?\s*:(?=\s|$)/gmu'
      - '/(?<=[{,]\s*)[\p{L}\w-]+(?=\s*:)/gu'
      - '/(?<=:\s+)[\p{L}\w/.-]+\s*$/gmu'
      - '/(?<=[\[,]\s*)[\p{L}\w/.''"-]+(?=\s*[,\]])/gu'

