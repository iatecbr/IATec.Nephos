# Nephos npm release pipeline (Azure DevOps, org `sda-iatec`).
#
# Structure follows the reference pipeline of IATec.Nephos.Blocks.Angular
# (`projects/iatec/nephos-layout/azure-pipelines.yml`): self-hosted Linux pool,
# NodeTool, `.npmrc.pipeline` copied to `.npmrc` and filled by `replacetokens`,
# `npmAuthenticate`, publish to the `IATec.Community` feed, `.npmrc` removed
# at the end. The code review and SonarQube stages of the reference are not
# used here.
#
# Build also builds the static Storybook and publishes it as the private
# pipeline artifact `storybook` (P19, annotation of 26/10/2026), for the team
# to host. The pipeline does not host it anywhere.
#
# The pipeline is created in Azure DevOps from the GitHub repository
# `iatecbr/IATec.Nephos`; this file is its definition. Human prerequisites
# (variable group, secret, extension, feed permission) are in
# `docs/release.md`.
#
# It depends on the package configuration from PR #89 (`feat/npm-package-rc1`):
# name `@iatec/nephos`, the scripts `build:lib`, `test:package` and
# `pack:check`, `prepublishOnly` and `publishConfig`. Do not merge it before
# that PR.
#
# Secrets: this file holds only references to pipeline variables. Real values
# live in the variable group `nuget-credentials`, which also holds the secret
# variable `FONTAWESOME_NPM_AUTH_TOKEN`. `.npmrc.pipeline` holds placeholders
# only; the real `.npmrc` is generated on the agent and never committed.

# Tag builds only (for example `v5.0.0-rc.1`). No branch builds.
trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v5.*'

# Pull requests to the integration branch run Build and Test only. Publish
# never runs on a PR (see its condition). Keep "Make secrets available to
# builds of forks" disabled on the pipeline.
pr:
  branches:
    include:
      - v/5.0.0

parameters:
  # Manual runs only: a tag push publishes without this flag. A manual run
  # publishes only when this is true and the run is on a `v5.*` tag or on the
  # integration branch `v/5.0.0`.
  - name: publish
    displayName: Publish to the feed (manual runs only)
    type: boolean
    default: false

variables:
  # Feed credentials: NPM_IATEC_HOST_COMMUNITY, NPM_Username, Base64_Password
  # and NPM_email, consumed by `.npmrc.pipeline` through replacetokens.
  - group: nuget-credentials
  # Node version validated for the repository (24.18).
  - name: nodeVersion
    value: '24.x'
  - name: packageName
    value: '@iatec/nephos'
  # dist-tag used for `-rc.N` versions. A prerelease never goes to `latest`.
  - name: prereleaseTag
    value: 'rc'
  - name: packArtifactName
    value: 'npm-package'
  - name: storybookArtifactName
    value: 'storybook'

stages:
  # ---------------------------------------------------------------------------
  # Build: install, tokens, library build, package checks, Storybook, pack.
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: BuildJob
        displayName: Build Job
        pool:
          name: IATec-Builds-Agents-Linux
        timeoutInMinutes: 30
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - task: Bash@3
            displayName: Prepare .npmrc file
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: cp .npmrc.pipeline .npmrc

          # Fills the #{NAME}# placeholders from the variable group
          # `nuget-credentials`. Same settings as the reference pipeline.
          - task: replacetokens@6
            displayName: Replace variables in .npmrc
            inputs:
              targetFiles: .npmrc
              encoding: auto
              writeBOM: true
              actionOnMissing: warn
              keepToken: false
              tokenPrefix: '#{'
              tokenSuffix: '}#'

          - task: Npm@1
            displayName: Install dependencies
            inputs:
              command: ci
              workingDir: $(Build.SourcesDirectory)
            env:
              NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

          # Generated tokens must match the source tokens committed in the repo.
          - bash: |
              set -euo pipefail
              npm run build:tokens
              git diff --exit-code src/tokens/generated/tokens.css
            displayName: Tokens are up to date
            workingDirectory: $(Build.SourcesDirectory)

          - bash: |
              set -euo pipefail
              npm run build:lib
              npm run test:package
              npm run pack:check
            displayName: Build library and check the package
            workingDirectory: $(Build.SourcesDirectory)

          # Static Storybook (P19: private CI artifact). It runs before the
          # pack, so a broken Storybook fails Build and Publish never starts.
          # The workspace survives between runs on self-hosted agents, so the
          # output folder is emptied first.
          - bash: |
              set -euo pipefail
              rm -rf storybook-static
              npm run build-storybook
            displayName: Build Storybook
            workingDirectory: $(Build.SourcesDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish Storybook artifact
            inputs:
              targetPath: $(Build.SourcesDirectory)/storybook-static
              artifact: $(storybookArtifactName)

          # Version guard. On a tag build the tag must be `v<package.json version>`.
          # It also fails early on a prerelease id this pipeline does not publish.
          - bash: |
              set -euo pipefail
              VERSION="$(node -p "require('./package.json').version")"
              echo "package.json version: ${VERSION}"
              case "${VERSION}" in
                *-rc.*) ;;
                *-*)
                  echo "##vso[task.logissue type=error]Unsupported prerelease '${VERSION}'. Only '-rc.N' prereleases are published."
                  exit 1 ;;
              esac
              case "$(Build.SourceBranch)" in
                refs/tags/*)
                  EXPECTED="refs/tags/v${VERSION}"
                  if [ "$(Build.SourceBranch)" != "${EXPECTED}" ]; then
                    echo "##vso[task.logissue type=error]Tag $(Build.SourceBranch) does not match package.json version (expected ${EXPECTED}). Bump the version or retag."
                    exit 1
                  fi ;;
                *)
                  echo "Not a tag build; tag/version match not required." ;;
              esac
            displayName: Version guard
            workingDirectory: $(Build.SourcesDirectory)

          # The tarball that Publish ships is exactly the one validated here.
          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              npm pack --pack-destination "$(Build.ArtifactStagingDirectory)"
              ls -l "$(Build.ArtifactStagingDirectory)"
            displayName: Pack tarball
            workingDirectory: $(Build.SourcesDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish package artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: $(packArtifactName)

          # Self-hosted agents keep the workspace: never leave credentials behind.
          - task: CmdLine@2
            displayName: Remove .npmrc
            condition: always()
            inputs:
              script: rm -f .npmrc
              workingDirectory: $(Build.SourcesDirectory)

  # ---------------------------------------------------------------------------
  # Test: repository checks and the browser tests. Runs in parallel with Build.
  # ---------------------------------------------------------------------------
  - stage: Test
    displayName: Test Stage
    dependsOn: []
    jobs:
      - job: TestJob
        displayName: Test Job
        pool:
          name: IATec-Builds-Agents-Linux
        timeoutInMinutes: 30
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - task: Bash@3
            displayName: Prepare .npmrc file
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: cp .npmrc.pipeline .npmrc

          - task: replacetokens@6
            displayName: Replace variables in .npmrc
            inputs:
              targetFiles: .npmrc
              encoding: auto
              writeBOM: true
              actionOnMissing: warn
              keepToken: false
              tokenPrefix: '#{'
              tokenSuffix: '}#'

          - task: Npm@1
            displayName: Install dependencies
            inputs:
              command: ci
              workingDir: $(Build.SourcesDirectory)
            env:
              NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

          - bash: |
              set -euo pipefail
              npm run typecheck
              npm run test:naming
              npm run test:operacao
              npm run test:i18n
            displayName: Typecheck and repository checks
            workingDirectory: $(Build.SourcesDirectory)

          # Browser-mode Vitest needs the Chromium build from Playwright.
          - bash: |
              set -euo pipefail
              npx playwright install --with-deps chromium
              npm test
            displayName: Component tests (Chromium)
            workingDirectory: $(Build.SourcesDirectory)

          - task: CmdLine@2
            displayName: Remove .npmrc
            condition: always()
            inputs:
              script: rm -f .npmrc
              workingDirectory: $(Build.SourcesDirectory)

  # ---------------------------------------------------------------------------
  # Publish: tag builds, or manual runs with `publish: true`. Never on a PR.
  # A plain job, with no Azure DevOps environment: the feed credentials come
  # from the variable group `nuget-credentials`, as in Build and Test. Pushing
  # a `v5.*` tag is the release decision; there is no approval step.
  # ---------------------------------------------------------------------------
  - stage: Publish
    displayName: Publish Stage
    dependsOn:
      - Build
      - Test
    condition: >-
      and(
        succeeded(),
        or(
          and(
            ne(variables['Build.Reason'], 'Manual'),
            startsWith(variables['Build.SourceBranch'], 'refs/tags/v5.')
          ),
          and(
            eq(variables['Build.Reason'], 'Manual'),
            eq('${{ parameters.publish }}', 'True'),
            or(
              startsWith(variables['Build.SourceBranch'], 'refs/tags/v5.'),
              eq(variables['Build.SourceBranch'], 'refs/heads/v/5.0.0')
            )
          )
        )
      )
    jobs:
      - job: PublishJob
        displayName: Publish Job
        pool:
          name: IATec-Builds-Agents-Linux
        timeoutInMinutes: 15
        steps:
          # The job needs the repo for `.npmrc.pipeline` (same commit as the
          # validated build). The tarball comes from the Build artifact below.
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - task: DownloadPipelineArtifact@2
            displayName: Download package artifact
            inputs:
              artifact: $(packArtifactName)
              path: $(Pipeline.Workspace)/$(packArtifactName)

          - task: Bash@3
            displayName: Prepare .npmrc file
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: cp .npmrc.pipeline .npmrc

          - task: replacetokens@6
            displayName: Replace variables in .npmrc
            inputs:
              targetFiles: .npmrc
              encoding: auto
              writeBOM: true
              actionOnMissing: warn
              keepToken: false
              tokenPrefix: '#{'
              tokenSuffix: '}#'

          - task: npmAuthenticate@0
            displayName: Authenticate
            inputs:
              workingFile: $(Build.SourcesDirectory)/.npmrc

          # Resolve version and dist-tag from the tarball itself, refuse
          # a prerelease on `latest`, and refuse an already published
          # version (Azure Artifacts versions are immutable).
          - bash: |
              set -euo pipefail
              export NPM_CONFIG_USERCONFIG="$(Build.SourcesDirectory)/.npmrc"
              TARBALL="$(ls "$(Pipeline.Workspace)/$(packArtifactName)"/*.tgz)"
              echo "Tarball: ${TARBALL}"

              VERSION="$(tar -xzOf "${TARBALL}" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
              NAME="$(tar -xzOf "${TARBALL}" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
              if [ "${NAME}" != "$(packageName)" ]; then
                echo "##vso[task.logissue type=error]Tarball package is '${NAME}', expected '$(packageName)'."
                exit 1
              fi

              case "${VERSION}" in
                *-rc.*) TAG="$(prereleaseTag)" ;;
                *-*)
                  echo "##vso[task.logissue type=error]Unsupported prerelease '${VERSION}'; refusing to publish."
                  exit 1 ;;
                *) TAG="latest" ;;
              esac
              echo "Version ${VERSION} -> dist-tag ${TAG}"

              # The @iatec registry comes from .npmrc (NPM_IATEC_HOST_COMMUNITY).
              set +e
              EXISTING="$(npm view "$(packageName)@${VERSION}" version 2>"$(Agent.TempDirectory)/view.err")"
              STATUS=$?
              set -e
              if [ ${STATUS} -ne 0 ] && ! grep -q 'E404' "$(Agent.TempDirectory)/view.err"; then
                echo "##vso[task.logissue type=error]Could not query the feed (npm view exit ${STATUS}); see the log, not publishing."
                sed 's/_authToken=.*/_authToken=***/' "$(Agent.TempDirectory)/view.err"
                exit 1
              fi
              if [ -n "${EXISTING}" ]; then
                echo "##vso[task.logissue type=error]$(packageName)@${VERSION} already exists in the feed. Azure Artifacts versions are immutable: bump to the next rc.N, merge, and tag again."
                exit 1
              fi

              echo "##vso[task.setvariable variable=tarball]${TARBALL}"
              echo "##vso[task.setvariable variable=distTag]${TAG}"
            displayName: Resolve dist-tag and check the version is new
            workingDirectory: $(Build.SourcesDirectory)

          # `--ignore-scripts`: Validate already ran test:package and
          # pack:check, so the `prepublishOnly` hook (npm run test:package)
          # must not run here; this job has no dist/ and would fail.
          # `--tag` overrides `publishConfig.tag`.
          - task: Npm@1
            displayName: Publish
            inputs:
              command: custom
              customCommand: publish "$(tarball)" --ignore-scripts --tag "$(distTag)"
              customRegistry: useNpmrc
              workingDir: $(Build.SourcesDirectory)
            env:
              NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

          - task: CmdLine@2
            displayName: Remove .npmrc
            condition: always()
            inputs:
              script: rm -f .npmrc
              workingDirectory: $(Build.SourcesDirectory)
